[platformio]
; Upload and build use this sketch unless you pick another. Switch to imu after the scan passes.
default_envs = scan

[env]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
; USB CDC needs no flag here: this board's definition already sets ARDUINO_USB_CDC_ON_BOOT=1.

[env:scan]
build_src_filter = +<scan/>

[env:imu]
build_src_filter = +<imu/>
lib_deps = adafruit/Adafruit BNO08x
